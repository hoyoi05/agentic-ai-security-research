  - id: nist-agent-identity-authorization-2026
    title: "Accelerating the Adoption of Software and Artificial Intelligence Agent Identity and Authorization"
    type: government-concept-paper
    year: 2026
    published_date: 2026-02-05
    authors_or_organization: "Harold Booth, William Fisher, Ryan Galluzzo, and Joshua Roberts (NIST)"
    url: https://csrc.nist.gov/pubs/other/2026/02/05/accelerating-the-adoption-of-software-and-ai-agent/ipd
    topics: [agent-identity, authorization, auditing, non-repudiation, prompt-injection]
    abstract_summary_type: paraphrased-from-official-announcement
    abstract_summary_ko: >-
      NIST NCCoE가 소프트웨어 및 AI 에이전트에 기존 신원 표준과 모범사례를 적용하기 위한
      프로젝트 고려사항을 제시한 개념 문서다. 식별, 권한부여, 감사, 부인방지와
      프롬프트 주입 통제를 포함해 산업의 사용 사례·기술·표준 현황에 대한 의견을 요청한다.
    evidence_status: official-source-checked
    claims_status: government-published-draft
    reproduction_status: not-applicable
