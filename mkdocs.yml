site_name: Agentic AI Security Research
site_description: Public research portal for Agentic AI security
site_url: https://hoyoi05.github.io/agentic-ai-security-research/
repo_url: https://github.com/hoyoi05/agentic-ai-security-research
repo_name: hoyoi05/agentic-ai-security-research
theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
nav:
  - 홈: index.md
  - 연구 의제:
      - 신규 주제 탐색: research/topic-exploration.md
      - FRIDA:
          - 연구 개요: research/frida/overview.md
          - 선행연구 맵: research/frida/related-work-map.md
          - 최소 포렌식 증거: research/frida/minimum-evidence.md
          - 논문·실험 로드맵: research/frida/research-roadmap.md
  - 서베이:
      - 범위와 연구 질문: survey/scope.md
      - SMS 프로토콜: survey/protocol.md
      - 공개 검색원 전략: survey/search-strategy.md
      - Seed 회수 검증: survey/seed-validation.md
      - Pilot 결과: survey/pilot-results.md
      - 제목·초록 스크리닝: survey/title-abstract-screening-pilot.md
      - 코딩 프레임워크: survey/coding-framework.md
      - 위협 모델: survey/threat-model.md
      - 연구 갭: survey/research-gaps.md
  - 문헌:
      - 검증 카탈로그: literature/catalog.md
  - 실험:
      - 연구 설계: experiments/design.md
  - 자료 관리 정책: resources/policy.md
  - 기여 방법: contributing.md
